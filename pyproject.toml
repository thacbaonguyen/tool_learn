[project]
name = "local-video-subtitle-poc"
version = "0.1.0"
description = "Local video lesson manager and subtitle processing POC"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.116.1",
  "Jinja2==3.1.6",
  "Pillow==11.1.0",
  "psutil==6.1.1",
  "python-multipart==0.0.20",
  "SQLAlchemy==2.0.43",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["app", "poc"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]
